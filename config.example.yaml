# Estratto configuration template
# Copy this file to `config.local.yaml` (or another untracked path) and fill in the
# non-secret values. Keep secrets in `.env`, not here.

telegram:
  # Shared Telegram Desktop API credentials are bundled as defaults. Only set these
  # here if you want to override them with your own.
  api_id: 2040
  api_hash: "b18441a1ff607e10a989891a5462e627"
  session_name: "estratto"
  channel: "books_magazine"

staging:
  dir: "./staging"
  needs_review_dir: "./needs-review"

extensions:
- ".pdf"
- ".epub"
- ".mobi"
- ".cbz"
- ".cbr"

db:
  path: "./estratto.db"

storage:
  chunk_size: 1048576

openai:
  enabled: false
  # Keep the API key in `.env` as ESTRATTO_OPENAI_API_KEY.
  api_key: ""
  model: "gpt-4o-mini"
  confidence_threshold: 0.6
  excerpt_chars: 1500

libraries:
  book:
    root: "/library/Books"
    template: "{category}/{author}/{title}/{title}.{ext}"
  magazine:
    root: "/library/Magazines"
    template: "{category}/{magazine}/{year}/{magazine} {issue}.{ext}"
  comic:
    root: "/library/Comics"
    template: "{category}/{series}/{series} {volume}.{ext}"
  academic-article:
    root: "/library/Articles"
    template: "{category}/{author}/{title}/{title}.{ext}"

filename_patterns:
- '^(?P<author>[^-]+?)\s*-\s*(?P<title>.+)$'
- '^(?P<magazine>[^-]+?)\s*-\s*(?P<year>\d{4})-(?P<issue>\d{1,2})$'
- '^(?P<series>.+?)\s+(?P<volume>\d+)$'

logging:
  level: "INFO"
  file: ""

web:
  host: "0.0.0.0"
  port: 8001
